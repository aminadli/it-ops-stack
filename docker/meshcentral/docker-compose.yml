services:
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:1.1.57
    container_name: meshcentral
    restart: unless-stopped
    ports:
      - "8086:8086"
      - "8087:8087"
    environment:
      - REVERSE_PROXY=false
      - ALLOW_NEW_ACCOUNTS=false
      - WEBRTC=false
      - NODE_ENV=production
      - USE_MONGODB=false
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups
      - ./config.json:/opt/meshcentral/meshcentral-data/config.json:ro
    networks:
      - shared_network

networks:
  shared_network:
    external: true

volumes:
  meshcentral-data:
  meshcentral-files:
  meshcentral-backups:
