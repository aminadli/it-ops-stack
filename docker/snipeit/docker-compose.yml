services:
  snipeit:
    image: snipe/snipe-it:latest
    container_name: snipeit
    restart: unless-stopped
    ports:
      - "8088:80"
    env_file:
      - .env
    volumes:
      - snipeit-data:/var/lib/snipeit
    networks:
      - shared_network
    depends_on:
      - snipeit-db

  snipeit-db:
    image: mariadb:11
    container_name: snipeit-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - snipeit-db-data:/var/lib/mysql
    networks:
      - shared_network

networks:
  shared_network:
    external: true

volumes:
  snipeit-data:
  snipeit-db-data:
