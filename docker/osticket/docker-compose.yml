services:
  osticket:
    image: cloudcogs/osticket:latest
    container_name: osticket
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      HELPDESK_NAME: IT Helpdesk
      DEFAULT_EMAIL: aminsolehuddin@gmail.com
      TABLE_PREFIX: ost_
      INSTALL_SECRET: ${OSTICKET_SECRET}
      ADMIN_FIRSTNAME: Amin
      ADMIN_LASTNAME: Adli
      ADMIN_EMAIL: aminsolehuddin@gmail.com
      ADMIN_USERNAME: itsupport
      ADMIN_PASSWORD: ${OSTICKET_ADMIN_PASS}
      CONFIG_DBHOST: osticket-db
      MARIADB_DATABASE: osticket
      MARIADB_USER: osticket
      MARIADB_PASSWORD: ${OSTICKET_DB_PASS}
      SMTP_HOST: ""
      SMTP_PORT: 25
      SMTP_FROM: aminsolehuddin@gmail.com
      SMTP_TLS: 0
    volumes:
      - osticket-data:/var/www/html
    networks:
      - shared_network
    depends_on:
      osticket-db:
        condition: service_healthy

  osticket-db:
    image: mysql:8.3
    container_name: osticket-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OSTICKET_DB_ROOT_PASS}
      MYSQL_DATABASE: osticket
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${OSTICKET_DB_PASS}
    volumes:
      - osticket-db-data:/var/lib/mysql
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${OSTICKET_DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  shared_network:
    external: true

volumes:
  osticket-data:
  osticket-db-data:
