services:
  osticket:
    image: hlhd/osticket:latest
    container_name: osticket
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      DB_HOST: osticket-db
      DB_NAME: osticket
      DB_USER: osticket
      DB_PASS: ${DB_PASS}
      INSTALL_SECRET: ${INSTALL_SECRET}
      INSTALL_EMAIL: ${INSTALL_EMAIL}
      INSTALL_NAME: IT Helpdesk
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME}
      ADMIN_EMAIL: admin@example.com##PLACEHOLDER
      ADMIN_USER: ostadmin
      ADMIN_PASS: ${ADMIN_PASS}
      SMTP_HOST: ""
      SMTP_PORT: 25
      SMTP_FROM: helpdesk@example.com##PLACEHOLDER
      SMTP_TLS: 0
    volumes:
      - osticket-data:/var/www/html
    networks:
      - shared_network
    depends_on:
      - osticket-db

  osticket-db:
    image: mysql:8.3
    container_name: osticket-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: osticket
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - osticket-db-data:/var/lib/mysql
    networks:
      - shared_network

networks:
  shared_network:
    external: true

volumes:
  osticket-data:
  osticket-db-data:
